
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="{% block metadescription %} The simplest GPS Tracker in the world {% endblock %}">
    <meta name="author" content="">
    <!--<link rel="icon" href="../../../../favicon.ico">-->

    <title>{% block title %} Pathbox {% endblock %}</title>

    <!-- Bootstrap core CSS -->
    <link rel="stylesheet" href="https://bootswatch.com/4/lux/bootstrap.min.css" >

    <link rel="stylesheet" href="{{url_for('static', filename='styles.css')}}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/simple-line-icons/2.4.1/css/simple-line-icons.min.css" rel="stylesheet" type="text/css">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">

    <!-- Global site tag (gtag.js) - Google Analytics -->
    {% if not config.DEBUG %}
        <script async src="https://www.googletagmanager.com/gtag/js?id=UA-35934020-9"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'UA-35934020-9', { 'anonymize_ip': true });

        </script>
    {% endif %}
</head>

<body>



<nav class="navbar navbar-expand-md navbar-dark bg-primary">
    <div class=" container">
        <a class="navbar-brand" href="/">
            <img src="/static/compass.svg" width="25" height="25" alt="">
            Pathbox
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbar" aria-controls="navbar" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbar">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="/faq">Help</a>
                </li>
                {#
            <li class="nav-item">
              <a class="nav-link" href="https://play.google.com/store/apps/details?id=de.casparwre.gpslogger">Get the app</a>
            </li>
#}

            </ul>

        </div>
    </div>
</nav>



<main role="main">

    {% block body %}{% endblock %}



</main>

<footer class="container mt-4 text-center">
    <p class="text-muted"><i class="icon-bubble"></i> Hi! Missing a feature or have feedback? <a href="mailto:caspar.wrede@gmail.com">Let us know.</a></p>
</footer>

<!-- Bootstrap core JavaScript
================================================== -->
<!-- Placed at the end of the document so the pages load faster -->
<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
</body>
</html>
