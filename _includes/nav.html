<div class="announce">
  <div class="wrap announce__inner">
    <span class="announce__dot" aria-hidden="true"></span>
    <span>Pathbox is being rebuilt — launching soon on Android &amp; iPhone.</span>
    <a class="announce__link" href="{{ site.data.site.notify_url }}">Get launch updates →</a>
  </div>
</div>

<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="/" aria-label="Pathbox home">
      <img class="brand__mark" src="/assets/img/compass.svg" width="26" height="26" alt="">
      <span class="brand__word">Pathbox</span>
    </a>

    <input type="checkbox" id="nav-toggle" class="nav-toggle" hidden>
    <label for="nav-toggle" class="nav-toggle__btn" aria-label="Menu">
      <span></span><span></span><span></span>
    </label>

    <nav class="site-nav" aria-label="Primary">
      {% for item in site.data.site.nav %}
        <a class="site-nav__link" href="{{ item.url }}">{{ item.label }}</a>
      {% endfor %}
      <a class="site-nav__cta" href="{{ site.data.site.notify_url }}">{{ site.data.site.cta_label }}</a>
    </nav>
  </div>
</header>
